# Mirrors the URLhaus feed (CC0/public domain — redistribution permitted) so
# SafeQR clients have a fallback if urlhaus.abuse.ch is unreachable.
# OpenPhish is deliberately NOT mirrored: its community-feed terms do not
# permit redistribution. Clients fall back to their on-device cache for it.
#
# abuse.ch retired the old /downloads/text_recent/ URL (HTTP 410) and now
# requires a free Auth-Key for bulk exports. The key lives in the repo secret
# URLHAUS_AUTH_KEY and must never be committed or echoed.
name: Mirror threat feeds
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (offset to avoid top-of-hour load)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch URLhaus recent feed
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: |
          if [ -z "$URLHAUS_AUTH_KEY" ]; then
            echo "URLHAUS_AUTH_KEY secret is not set" >&2
            exit 1
          fi
          # The key is part of the export URL; curl -f prints only the HTTP
          # status on failure (not the URL), and Actions masks the secret.
          curl -fsSL --max-time 120 \
            "https://urlhaus-api.abuse.ch/v2/files/exports/${URLHAUS_AUTH_KEY}/recent.csv" \
            -o /tmp/urlhaus.csv
          # Convert the CSV export to the one-URL-per-line format clients expect.
          python3 - <<'PY'
          import csv, re
          rows = open('/tmp/urlhaus.csv', encoding='utf-8', errors='replace').read().splitlines()
          # Header is usually a comment line like "# id,dateadded,url,..."
          col = 2
          for line in rows:
              if line.startswith('#') and 'url' in line.lower() and ',' in line:
                  names = [c.strip().strip('"') for c in line.lstrip('#').split(',')]
                  if 'url' in names:
                      col = names.index('url')
                  break
          urls = []
          for rec in csv.reader(l for l in rows if l and not l.startswith('#')):
              if len(rec) > col and re.match(r'^https?://', rec[col]):
                  urls.append(rec[col])
          open('/tmp/urlhaus.txt', 'w', encoding='utf-8').write('\n'.join(urls) + '\n')
          print(f'converted {len(urls)} URLs')
          PY
          # Sanity check: a real feed is thousands of URLs.
          lines=$(grep -c '^http' /tmp/urlhaus.txt || true)
          if [ "$lines" -lt 1000 ]; then
            echo "Feed looks truncated ($lines URLs) — keeping previous mirror" >&2
            exit 1
          fi
          mkdir -p v1/threats
          mv /tmp/urlhaus.txt v1/threats/urlhaus.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > v1/threats/urlhaus.updated
      - name: Commit if changed
        run: |
          git config user.name 'safeqr-mirror-bot'
          git config user.email 'actions@github.com'
          git add v1/threats
          git diff --cached --quiet || git commit -m "Mirror URLhaus feed"
          git push
