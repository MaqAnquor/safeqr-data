# Mirrors URLhaus malware-URL data (CC0/public domain — redistribution
# permitted) so SafeQR clients have a current feed.
#
# Source change, Nov 2026: urlhaus.abuse.ch retired its public download files
# (HTTP 410 Gone) and its API now requires an account Auth-Key. We now read
# urlhaus-filter (https://gitlab.com/malware-filter/urlhaus-filter, CC0+MIT),
# which rebuilds the same URLhaus data from the API twice a day, and convert it
# to the one-URL-per-line format the app parses. Output path is unchanged, so
# no app release is needed.
#
# OpenPhish is deliberately NOT mirrored: its community-feed terms do not
# permit redistribution.
name: Mirror threat feeds
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (offset to avoid top-of-hour load)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch URLhaus data (via urlhaus-filter, with mirrors)
        run: |
          # Same file, three independent hosts; first one that works wins.
          for src in \
            'https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-online.txt' \
            'https://malware-filter.pages.dev/urlhaus-filter-online.txt' \
            'https://curbengh.github.io/malware-filter/urlhaus-filter-online.txt'
          do
            if curl -fsSL --retry 2 --max-time 120 "$src" -o /tmp/urlhaus-filter.txt; then
              echo "Fetched from $src"
              break
            fi
            echo "Failed: $src" >&2
            rm -f /tmp/urlhaus-filter.txt
          done
          test -s /tmp/urlhaus-filter.txt || { echo "All sources failed — keeping previous mirror" >&2; exit 1; }
      - name: Convert and sanity-check
        run: |
          python3 scripts/convert_urlhaus_filter.py /tmp/urlhaus-filter.txt /tmp/urlhaus.txt
          # A real feed is thousands of URLs; anything less means upstream broke.
          lines=$(grep -c '^http' /tmp/urlhaus.txt || true)
          if [ "$lines" -lt 1000 ]; then
            echo "Feed looks truncated ($lines URLs) — keeping previous mirror" >&2
            exit 1
          fi
          mkdir -p v1/threats
          mv /tmp/urlhaus.txt v1/threats/urlhaus.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > v1/threats/urlhaus.updated
      - name: Commit if changed
        run: |
          git config user.name 'safeqr-mirror-bot'
          git config user.email 'actions@github.com'
          git add v1/threats
          git diff --cached --quiet || git commit -m "Mirror URLhaus feed"
          git push
